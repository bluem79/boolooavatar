<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boolooavatar ریموت</title>
<style>
:root{--bg:#f6f5f2;--cd:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#6d4aff;--bd:#e3e1db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15151a;--cd:#1f1f27;--tx:#f0eff5;--mu:#9a99a8;--bd:#33333f}}
:root[data-theme=dark]{--bg:#15151a;--cd:#1f1f27;--tx:#f0eff5;--mu:#9a99a8;--bd:#33333f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,Tahoma,sans-serif}
main{max-width:560px;margin:auto;padding:12px;display:grid;gap:12px}
h3{margin:0;font-size:15px}small{color:var(--mu)}
button,input{font:inherit;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
button{cursor:pointer}button:active{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
#ge button{font-size:32px;padding:18px 6px}#gc button{padding:22px 6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script></head><body><main>
<div class="bar"><input id="rt" placeholder="کد اتاق" style="flex:1;direction:ltr"><button id="lg">EN</button><button id="cn">ذخیره</button></div>
<small id="cs"></small><br><small id="st">کد اتاق رو همون کدی بذارید که توی صفحه اصلی نوشتید.</small>
<h3>🙂 ایموجی‌ها</h3><div class="g" id="ge"></div>
<h3>🎬 کلیپ‌ها</h3><div class="g" id="gc"></div>
<button id="pl">🎮 روشن/خاموش حالت بازی</button>
<details><summary>ویرایش برچسب‌ها</summary><div class="g" id="ed" style="margin-top:8px"></div></details>
</main>
<script>
const $=id=>document.getElementById(id);
let E=['❤️','😂','😡','👏','😮'],C=['کلیپ ۱','کلیپ ۲','کلیپ ۳','کلیپ ۴','کلیپ ۵'],room='';
try{E=JSON.parse(localStorage.getItem('re'))||E;C=JSON.parse(localStorage.getItem('rcl'))||C;room=localStorage.getItem('rt')||''}catch(e){}
const q=new URLSearchParams(location.search).get('room');if(q)room=q;
$('rt').value=room;
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let mqs=[],lastHb=0,LOCAL=false;
function connect(){
  mqs.forEach(c=>{try{c.end(true)}catch(e){}});mqs=[];
  room=$('rt').value.trim().replace(/[^\w-]/g,'');$('rt').value=room;
  try{localStorage.setItem('rt',room)}catch(e){}
  if(!room||typeof mqtt==='undefined')return;
  const T='boolooavatar/'+room;
  BROKERS.forEach(u=>{
    const c=mqtt.connect(u,{clientId:'blr_'+Math.random().toString(16).slice(2,10),reconnectPeriod:5000,connectTimeout:8000,keepalive:20,queueQoSZero:false});
    mqs.push(c);c.on('connect',()=>c.subscribe(T+'/hb'));c.on('message',()=>{lastHb=Date.now()});c.on('error',()=>{});
  });
}
setInterval(()=>{
  if(LOCAL)return;
  const n=mqs.filter(c=>c.connected).length;
  $('cs').textContent=!room?'کد اتاق رو بنویسید و ذخیره بزنید':typeof mqtt==='undefined'?'کتابخانه لود نشد، اینترنت رو بررسی کنید':!n?'🟡 در حال اتصال به سرور…':Date.now()-lastHb<12000?'🟢 صفحه اصلی آنلاینه':'🟠 به سرور وصلم ولی صفحه اصلی پیدا نشد (کد اتاق یکی باشه و صفحه اصلی باز و متصل باشه)';
},1000);
function send(m){
  if(navigator.vibrate)navigator.vibrate(25);
  m.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(LOCAL){fetch('/cmd',{method:'POST',body:JSON.stringify(m)}).then(r=>{$('st').textContent=r.ok?'✓ ارسال شد '+new Date().toLocaleTimeString():'✗ خطا'}).catch(()=>{$('st').textContent='✗ به کامپیوتر وصل نیستم'});return}
  let n=0;mqs.forEach(c=>{if(c.connected){c.publish('boolooavatar/'+room+'/cmd',JSON.stringify(m));n++}});
  $('st').textContent=n?'✓ ارسال شد '+new Date().toLocaleTimeString():'✗ هنوز به سرور وصل نیستم';
}
function draw(){
  $('ge').innerHTML='';$('gc').innerHTML='';
  E.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>send({t:'react',i});$('ge').append(b)});
  C.forEach((x,i)=>{const b=document.createElement('button');b.textContent='🎬 '+x;b.onclick=()=>send({t:'clip',i});$('gc').append(b)});
}
function save(){try{localStorage.setItem('re',JSON.stringify(E));localStorage.setItem('rcl',JSON.stringify(C))}catch(e){}draw()}
E.forEach((x,i)=>{const t=document.createElement('input');t.value=x;t.maxLength=4;t.oninput=()=>{E[i]=t.value||'⭐';save()};$('ed').append(t)});
C.forEach((x,i)=>{const t=document.createElement('input');t.value=x;t.maxLength=14;t.oninput=()=>{C[i]=t.value||'کلیپ';save()};$('ed').append(t)});
$('cn').onclick=()=>{connect();$('st').textContent=''};
$('pl').onclick=()=>send({t:'play'});
fetch('/ping').then(r=>r.ok?r.text():'').then(t=>{
  if(t!=='boolooavatar')return;
  LOCAL=true;mqs.forEach(c=>{try{c.end(true)}catch(e){}});mqs=[];
  $('rt').style.display='none';$('cn').style.display='none';
  const poll=()=>fetch('/status').then(r=>r.text()).then(n=>{$('cs').textContent=+n>0?'🟢 صفحه اصلی آنلاینه (حالت محلی)':'🟠 به کامپیوتر وصلم ولی صفحه اصلی باز نیست'}).catch(()=>{$('cs').textContent='🔴 به کامپیوتر وصل نیستم'});
  poll();setInterval(poll,2000);
}).catch(()=>{});
draw();connect();
/* ===== i18n (fa/en) ===== */
const I18N=[
['برای شروع فایل اضافه کنید','Add files to get started'],
['روشن کردن میکروفون','Turn on microphone'],['میکروفون روشنه','Microphone on'],
['فقط اواتار','Avatar only'],['حالت بازی','Playing mode'],['روشن/خاموش حالت بازی','Toggle playing mode'],
['پس‌زمینه','Background'],['تصویر پس‌زمینه','Background image'],
['آستانه حرف زدن','Talking threshold'],['آستانه جیغ','Screaming threshold'],
['جنبیدن اواتار با صدا','Avatar moves with voice'],['کنترل از راه دور','Remote control'],
['کد اتاق رو همون کدی بذارید که توی صفحه اصلی نوشتید.','Use the same room code you typed on the main page.'],
['کد اتاق رو بنویسید و ذخیره بزنید','Type the room code and press Save'],
['کد اتاق','Room code'],['یه کد طولانی و مخصوص بنویسید','Type a long, unique code'],
['حالت محلی: نیازی به کد نیست','Local mode: no code needed'],
['در حال اتصال به سرور','Connecting to server'],['در حال اتصال محلی','Connecting (local)'],['در حال اتصال','Connecting'],
['اتصال','Connect'],['متصل محلی','Connected (local)'],['متصل','Connected'],['پیام:','message:'],['سرور','servers'],['قطع','Disconnected'],
['کتابخانه لود نشد (اینترنت رو بررسی کنید)','Library failed to load (check your internet)'],
['کتابخانه لود نشد، اینترنت رو بررسی کنید','Library failed to load, check your internet'],
['فایل‌ها داخل مرورگر همین دستگاه ذخیره می‌شن و بعد از بستن صفحه هم می‌مونن.',"Files are saved in this device's browser and stay after you close the page."],
['بیکار','Idle'],['حرف زدن','Talking'],['بازی','Playing'],['جیغ','Screaming'],
['ریکشن‌های سفارشی','Custom reactions'],['ریکشن','Reaction'],
['ایموجی، تصویر و صدای دلخواه','Emoji, image and your own sound'],
['ایموجی‌ها','Emoji'],['کلیپ‌ها','Clips'],['کلیپ','Clip'],['تمام اواتار','full avatar'],
['افزودن تصویر/ویدیو','Add image/video'],['تصویر','Image'],['صدا','Sound'],
['دسترسی به میکروفون ممکن نشد. اجازه دسترسی رو بررسی کنید.','Could not access the microphone. Please check the permission.'],
['ذخیره','Save'],['ویرایش برچسب‌ها','Edit labels'],['صفحه اصلی آنلاینه','Main page is online'],['(حالت محلی)','(local mode)'],
['به سرور وصلم ولی صفحه اصلی پیدا نشد (کد اتاق یکی باشه و صفحه اصلی باز و متصل باشه)','Connected to the server but the main page was not found (use the same room code and keep the main page open and connected)'],
['به کامپیوتر وصلم ولی صفحه اصلی باز نیست','Connected to the computer but the main page is not open'],
['به کامپیوتر وصل نیستم','Not connected to the computer'],['هنوز به سرور وصل نیستم','Not connected to the server yet'],
['ارسال شد','Sent'],['خطا','Error'],['ریموت','Remote']
];
const nz=s=>s.replace(/\u200c/g,'');
const DICT=I18N.map(([a,b])=>[nz(a),b]).sort((x,y)=>y[0].length-x[0].length);
function trStr(s){let n=nz(s),ch=false;for(const[a,b]of DICT)if(n.includes(a)){n=n.split(a).join(b);ch=true}
  return ch?n.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)):s}
let LANG='fa';try{LANG=localStorage.getItem('lang')||'fa'}catch(e){}
{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='fa')LANG=q}
const TITLE0=document.title,txRec=new WeakMap(),atRec=new WeakMap();
function fixTx(n){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;
  let r=txRec.get(n);if(!r||n.nodeValue!==r.shown){r={fa:n.nodeValue};txRec.set(n,r)}
  const v=LANG==='en'?trStr(r.fa):r.fa;r.shown=v;if(n.nodeValue!==v)n.nodeValue=v}
function fixAt(e){if(!e.getAttribute)return;const c=e.getAttribute('placeholder');if(c==null)return;
  let r=atRec.get(e);if(!r||c!==r.shown){r={fa:c};atRec.set(e,r)}
  const v=LANG==='en'?trStr(r.fa):r.fa;r.shown=v;if(c!==v)e.setAttribute('placeholder',v)}
function walkTx(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())fixTx(n);
  if(root.querySelectorAll)root.querySelectorAll('[placeholder]').forEach(fixAt)}
function setLang(l){LANG=l;try{localStorage.setItem('lang',l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';
  document.title=l==='en'?trStr(TITLE0):TITLE0;walkTx(document.body);$('lg').textContent=l==='fa'?'EN':'فا'}
new MutationObserver(ms=>ms.forEach(m=>{
  if(m.type==='characterData')fixTx(m.target);
  else if(m.type==='attributes')fixAt(m.target);
  else m.addedNodes.forEach(nd=>nd.nodeType===3?fixTx(nd):nd.nodeType===1&&walkTx(nd))
})).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder']});
{const _al=window.alert.bind(window);window.alert=m=>_al(LANG==='en'?trStr(String(m)):m)}
$('lg').onclick=()=>setLang(LANG==='fa'?'en':'fa');
setLang(LANG);
</script></body></html>
