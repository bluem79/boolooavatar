<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boolooavatar ریموت</title>
<style>
:root{--bg:#f6f5f2;--cd:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#6d4aff;--bd:#e3e1db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15151a;--cd:#1f1f27;--tx:#f0eff5;--mu:#9a99a8;--bd:#33333f}}
:root[data-theme=dark]{--bg:#15151a;--cd:#1f1f27;--tx:#f0eff5;--mu:#9a99a8;--bd:#33333f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,Tahoma,sans-serif}
main{max-width:560px;margin:auto;padding:12px;display:grid;gap:12px}
h3{margin:0;font-size:15px}small{color:var(--mu)}
button,input{font:inherit;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
button{cursor:pointer}button:active{background:var(--ac);color:#fff}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
#ge button{font-size:32px;padding:18px 6px}#gc button{padding:22px 6px}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script></head><body><main>
<div class="bar"><input id="rt" placeholder="کد اتاق" style="flex:1;direction:ltr"><button id="cn">ذخیره</button></div>
<small id="cs"></small><br><small id="st">کد اتاق رو همون کدی بذارید که توی صفحه اصلی نوشتید.</small>
<h3>🙂 ایموجی‌ها</h3><div class="g" id="ge"></div>
<h3>🎬 کلیپ‌ها</h3><div class="g" id="gc"></div>
<button id="pl">🎮 روشن/خاموش حالت بازی</button>
<details><summary>ویرایش برچسب‌ها</summary><div class="g" id="ed" style="margin-top:8px"></div></details>
</main>
<script>
const $=id=>document.getElementById(id);
let E=['❤️','😂','😡','👏','😮'],C=['کلیپ ۱','کلیپ ۲','کلیپ ۳','کلیپ ۴','کلیپ ۵'],room='';
try{E=JSON.parse(localStorage.getItem('re'))||E;C=JSON.parse(localStorage.getItem('rcl'))||C;room=localStorage.getItem('rt')||''}catch(e){}
const q=new URLSearchParams(location.search).get('room');if(q)room=q;
$('rt').value=room;
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let mqs=[],lastHb=0;
function connect(){
  mqs.forEach(c=>{try{c.end(true)}catch(e){}});mqs=[];
  room=$('rt').value.trim().replace(/[^\w-]/g,'');$('rt').value=room;
  try{localStorage.setItem('rt',room)}catch(e){}
  if(!room||typeof mqtt==='undefined')return;
  const T='boolooavatar/'+room;
  BROKERS.forEach(u=>{
    const c=mqtt.connect(u,{clientId:'blr_'+Math.random().toString(16).slice(2,10),reconnectPeriod:2000,connectTimeout:8000,keepalive:20,queueQoSZero:false});
    mqs.push(c);c.on('connect',()=>c.subscribe(T+'/hb'));c.on('message',()=>{lastHb=Date.now()});c.on('error',()=>{});
  });
}
setInterval(()=>{
  const n=mqs.filter(c=>c.connected).length;
  $('cs').textContent=!room?'کد اتاق رو بنویسید و ذخیره بزنید':typeof mqtt==='undefined'?'کتابخانه لود نشد، اینترنت رو بررسی کنید':!n?'🟡 در حال اتصال به سرور…':Date.now()-lastHb<12000?'🟢 صفحه اصلی آنلاینه':'🟠 به سرور وصلم ولی صفحه اصلی پیدا نشد (کد اتاق یکی باشه و صفحه اصلی باز و متصل باشه)';
},1000);
function send(m){
  if(navigator.vibrate)navigator.vibrate(25);
  m.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let n=0;mqs.forEach(c=>{if(c.connected){c.publish('boolooavatar/'+room+'/cmd',JSON.stringify(m));n++}});
  $('st').textContent=n?'✓ ارسال شد '+new Date().toLocaleTimeString():'✗ هنوز به سرور وصل نیستم';
}
function draw(){
  $('ge').innerHTML='';$('gc').innerHTML='';
  E.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>send({t:'react',i});$('ge').append(b)});
  C.forEach((x,i)=>{const b=document.createElement('button');b.textContent='🎬 '+x;b.onclick=()=>send({t:'clip',i});$('gc').append(b)});
}
function save(){try{localStorage.setItem('re',JSON.stringify(E));localStorage.setItem('rcl',JSON.stringify(C))}catch(e){}draw()}
E.forEach((x,i)=>{const t=document.createElement('input');t.value=x;t.maxLength=4;t.oninput=()=>{E[i]=t.value||'⭐';save()};$('ed').append(t)});
C.forEach((x,i)=>{const t=document.createElement('input');t.value=x;t.maxLength=14;t.oninput=()=>{C[i]=t.value||'کلیپ';save()};$('ed').append(t)});
$('cn').onclick=()=>{connect();$('st').textContent=''};
$('pl').onclick=()=>send({t:'play'});
draw();connect();
</script></body></html>
